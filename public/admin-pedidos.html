<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel de pedidos | Sistema Vendas Light</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#172c3d;font:15px Arial,sans-serif}.top{background:#102b46;color:#fff;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}.top strong{font-size:20px}.top a{color:#fff}.wrap{max-width:1120px;margin:24px auto;padding:0 18px}.summary,.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}.tile{background:white;border-radius:8px;padding:14px 19px;min-width:155px;box-shadow:0 2px 8px #102b4610}.tile span{display:block;color:#66788a;font-size:13px}.tile strong{font-size:24px}.tile.new strong{color:#c53040}.toolbar{background:white;padding:12px;border-radius:8px}.toolbar input[type=search]{flex:1;min-width:180px;padding:10px;border:1px solid #ccd6de;border-radius:5px}.toolbar select,.toolbar button,.statusSelect,.keybox input{padding:9px;border:1px solid #ccd6de;border-radius:5px;background:white;color:#23415a}.toolbar button,.keybox button{background:#194d76;color:white;border:0;font-weight:bold;cursor:pointer}.keybox{display:flex;gap:9px;align-items:center;background:#fff;border-radius:8px;padding:14px;margin-bottom:16px}.keybox input{flex:1;min-width:180px}.hint,.meta{color:#657688;font-size:13px;line-height:1.6}.list{display:grid;gap:12px}.order{background:#fff;border:1px solid #e0e6eb;border-radius:9px;padding:17px 19px}.order.new{border-left:5px solid #d93c4c}.orderhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.orderhead h2{font-size:18px;margin:0 0 4px}.badge{display:inline-block;border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;background:#fff0f1;color:#b52635;white-space:nowrap}.badge.confirmado,.badge.em_preparacao{background:#fff5df;color:#895d00}.badge.enviado{background:#eaf2ff;color:#2453a6}.badge.entregue{background:#e8f6ed;color:#167746}.badge.cancelado{background:#f0eeee;color:#555}.items{border-collapse:collapse;width:100%;margin-top:13px}.items th,.items td{text-align:left;border-top:1px solid #edf0f3;padding:8px 6px}.items th:last-child,.items td:last-child{text-align:right}.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e4e9ed;margin-top:9px;padding-top:12px;gap:10px}.total{font-size:18px;font-weight:800}.actions{display:flex;align-items:center;gap:8px}.statusSelect{font-weight:700}.empty{padding:40px;text-align:center;color:#718293;background:#fff;border-radius:9px}.error{color:#bb3040}.hidden{display:none!important}@media(max-width:700px){.summary,.toolbar,.keybox{flex-wrap:wrap}.toolbar input[type=search],.keybox input{flex-basis:100%}.orderhead,.foot{align-items:flex-start;flex-direction:column}.items{font-size:13px}.actions{width:100%;flex-wrap:wrap}}
</style></head><body><header class="top"><strong>Pedidos da loja</strong><a href="/">Voltar à vitrine</a></header><main class="wrap"><section class="keybox" id="loginBox"><label for="adminKey"><strong>Chave de acesso do painel</strong></label><input id="adminKey" type="password" autocomplete="current-password" placeholder="Cole a chave configurada no Netlify"><button id="connect">Acessar pedidos</button><span id="loginStatus" class="hint"></span></section><section id="dashboard" class="hidden"><div class="summary"><div class="tile new"><span>Novos pedidos</span><strong id="newCount">0</strong></div><div class="tile"><span>Total de pedidos</span><strong id="allCount">0</strong></div></div><div class="toolbar"><input id="search" type="search" placeholder="Buscar por cliente ou número do pedido"><select id="filter"><option value="todos">Todos os pedidos</option><option value="novo">Novos</option><option value="confirmado">Confirmados</option><option value="em_preparacao">Em preparação</option><option value="enviado">Enviados</option><option value="entregue">Entregues</option><option value="cancelado">Cancelados</option></select><button id="refresh">Atualizar</button><button id="forget">Sair do painel</button></div><div id="list" class="list"></div><div id="status" class="meta" style="margin-top:12px"></div></section></main><script>
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),labels={novo:'Novo / recebido',confirmado:'Confirmado',em_preparacao:'Em preparação',enviado:'Enviado',entregue:'Entregue',cancelado:'Cancelado'},states=Object.keys(labels);let key=sessionStorage.getItem('svl_admin_key')||'',orders=[],timer=null;
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{}),'X-SVL-Admin-Key':key},cache:'no-store'});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||'Não foi possível acessar o painel. Confira a chave e as configurações.');return data}
async function load(){try{orders=await api('/api/orders');render();$('status').textContent='Pedidos online atualizados automaticamente.';$('status').className='meta'}catch(error){$('status').textContent=error.message;$('status').className='meta error';if(/chave|painel de pedidos/.test(error.message)){logout();$('loginStatus').textContent=error.message}}}
function render(){const query=$('search').value.trim().toLocaleLowerCase('pt-BR'),filter=$('filter').value;$('newCount').textContent=orders.filter(o=>o.status==='novo').length;$('allCount').textContent=orders.length;const list=orders.filter(o=>(filter==='todos'||o.status===filter)&&(`${o.number} ${o.client?.nome||''} ${o.client?.email||''}`).toLocaleLowerCase('pt-BR').includes(query));$('list').innerHTML=list.length?list.map(o=>`<article class="order ${o.status==='novo'?'new':''}"><div class="orderhead"><div><h2>Pedido nº ${String(o.number).padStart(4,'0')}</h2><div class="meta">${new Date(o.createdAt).toLocaleString('pt-BR')} · ${safe(o.client?.nome||'Cliente')}<br>${safe(o.client?.telefone||'')} ${o.client?.email?' · '+safe(o.client.email):''}<br>${safe(o.client?.endereco||'')}</div></div><span class="badge ${safe(o.status)}">${labels[o.status]||safe(o.status)}</span></div><table class="items"><thead><tr><th>Qtd.</th><th>Código</th><th>Produto</th><th>Valor unitário</th><th>Total</th></tr></thead><tbody>${(o.items||[]).map(i=>`<tr><td>${Number(i.qty)||1}</td><td>${safe(i.sku||'')}</td><td>${safe(i.name||'')}</td><td>${money(i.price)}</td><td>${money((Number(i.price)||0)*(Number(i.qty)||1))}</td></tr>`).join('')}</tbody></table><div class="foot"><strong class="total">Total: ${money(o.total)}</strong><div class="actions"><label>Andamento:</label><select class="statusSelect" data-id="${safe(o.id)}">${states.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${labels[s]}</option>`).join('')}</select></div></div></article>`).join(''):'<div class="empty">Nenhum pedido encontrado.</div>';$('list').querySelectorAll('.statusSelect').forEach(select=>select.onchange=()=>updateStatus(select.dataset.id,select.value))}
async function updateStatus(id,status){try{await api('/api/orders/status',{method:'POST',body:JSON.stringify({id,status})});const order=orders.find(item=>item.id===id);if(order)order.status=status;render();$('status').textContent='Andamento atualizado. O cliente verá a alteração em alguns segundos.'}catch(error){$('status').textContent=error.message;$('status').className='meta error';load()}}
function logout(){key='';sessionStorage.removeItem('svl_admin_key');clearInterval(timer);$('dashboard').classList.add('hidden');$('loginBox').classList.remove('hidden');$('adminKey').value=''}
async function connect(){key=$('adminKey').value.trim();if(!key){$('loginStatus').textContent='Informe a chave configurada no Netlify.';return}try{await load();if(!$('status').classList.contains('error')){$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden');sessionStorage.setItem('svl_admin_key',key);clearInterval(timer);timer=setInterval(load,15000)}}catch{$('loginStatus').textContent='Não foi possível conectar.'}}
$('connect').onclick=connect;$('adminKey').onkeydown=e=>{if(e.key==='Enter')connect()};$('refresh').onclick=load;$('forget').onclick=logout;$('search').oninput=render;$('filter').onchange=render;if(key){$('adminKey').value=key;connect()}
</script></body></html>
